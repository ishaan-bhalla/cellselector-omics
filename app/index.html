<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CellSelector Omics</title>
    <meta name="description" content="Multi-omics cell line selection for drug discovery — AstraZeneca × University of Bristol" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Applied before React mounts (and before first paint) so the page
      // never flashes the wrong theme on load. Dark is the default: the
      // `light` class is only added when localStorage explicitly says so.
      // Kept in sync with src/utils/theme.ts's THEME_KEY/applyTheme — this
      // inline copy exists purely to run early; theme.ts is still the
      // single source of truth for every toggle/read after mount.
      (function () {
        try {
          if (localStorage.getItem('cso-theme') === 'light') {
            document.documentElement.classList.add('light')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
